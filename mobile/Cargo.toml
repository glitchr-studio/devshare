[package]
name = "devshare-mobile"
version.workspace = true
edition.workspace = true
publish.workspace = true
license.workspace = true
description = "The DevShare core as the mobile apps reach it, through UniFFI"

[lib]
name = "devshare_mobile"
# staticlib for the apps, cdylib for the bindings generator to read.
crate-type = ["lib", "staticlib", "cdylib"]

[dependencies]
devshare-core.workspace = true
anyhow.workspace = true
tokio.workspace = true
tracing.workspace = true
sha2 = "0.11"
thiserror = "2"
uniffi = { version = "0.32", features = ["tokio"] }

[dev-dependencies]
base64 = "0.22"
devshare-server = { path = "../server" }
