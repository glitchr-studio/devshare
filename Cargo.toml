[workspace]
resolver = "2"
members = ["protocol", "core", "cli", "server", "helper", "app", "mobile", "mobile/bindgen"]
# The desktop app needs a system web view to build, the mobile bridge is for
# the phones: both are left out of what the Docker targets compile and built
# natively (make app, make ios-app).
default-members = ["protocol", "core", "cli", "server", "helper"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-or-later"
publish = false

[workspace.dependencies]
devshare-protocol = { path = "protocol" }
devshare-core = { path = "core" }
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "io-util", "time", "sync", "signal", "process", "fs"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[profile.release]
strip = true

# The invitation's lookup key is deliberately slow to compute (Argon2id,
# about 150 ms optimized). Unoptimized it takes seconds: these two crates are
# optimized in every build, or tests and debug runs would crawl.
[profile.dev.package.argon2]
opt-level = 3
[profile.dev.package.blake2]
opt-level = 3
