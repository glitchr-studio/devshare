<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>DevShare</title>
  <link rel="stylesheet" href="panel.css">
</head>
<body>
  <!-- The panel that drops down from the menu bar icon: the projects with a
       switch each, sharing, the window. Everything here asks the same app
       as the window does. -->
  <div class="panel">
    <header>
      <strong>DevShare</strong>
      <span id="state" class="state"></span>
    </header>
    <ul id="cards" class="cards"></ul>
    <p id="empty" class="muted" hidden>No project yet. Open DevShare to add one.</p>
    <div class="share-bar">
      <button id="share" type="button" class="primary">Share</button>
      <span id="left" class="muted"></span>
    </div>
    <p id="error" class="error" role="alert" hidden></p>
    <footer>
      <button id="open" type="button" class="tool" title="Open DevShare" aria-label="Open DevShare">
        <svg viewBox="0 0 16 16" width="16" height="16" aria-hidden="true"><rect x="1.5" y="2.5" width="13" height="11" rx="2" fill="none" stroke="currentColor" stroke-width="1.5"/><path d="M1.5 6h13" stroke="currentColor" stroke-width="1.5"/></svg>
      </button>
      <button id="settings" type="button" class="tool" title="Settings" aria-label="Settings">
        <svg viewBox="0 0 16 16" width="16" height="16" aria-hidden="true"><circle cx="8" cy="8" r="2.2" fill="none" stroke="currentColor" stroke-width="1.5"/><path d="M8 1.5v2M8 12.5v2M1.5 8h2M12.5 8h2M3.4 3.4l1.4 1.4M11.2 11.2l1.4 1.4M3.4 12.6l1.4-1.4M11.2 4.8l1.4-1.4" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>
      </button>
      <span class="spacer"></span>
      <button id="quit" type="button" class="tool" title="Quit DevShare" aria-label="Quit">
        <svg viewBox="0 0 16 16" width="16" height="16" aria-hidden="true"><path d="M8 1.5v6" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/><path d="M4.6 4.2a5 5 0 1 0 6.8 0" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>
      </button>
    </footer>
  </div>
  <script src="panel.js"></script>
</body>
</html>
