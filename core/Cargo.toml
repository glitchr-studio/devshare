[package]
name = "devshare-core"
version.workspace = true
edition.workspace = true
publish.workspace = true

[dependencies]
devshare-protocol.workspace = true
anyhow.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
tracing.workspace = true
iroh = "1.3"
netstack-smoltcp = "0.2"
futures = "0.3"
tun = { version = "0.8", features = ["async"] }
simple-dns = "0.12"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
rand = "0.9"
base64 = "0.22"
qrcode = { version = "0.14", default-features = false, features = ["svg"] }
toml = "0.8"
serde_yaml_ng = "0.10"
gethostname = "1"
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
sha2 = "0.11"
# Not used directly. libc 0.2.190 no longer defines `in6_ifreq` on iOS, which
# netdev 0.46 (through iroh) needs there: without this pin the core does not
# build for iOS. Remove once either crate is fixed.
libc = "=0.2.189"

[dev-dependencies]
rqrr = "0.11"
rcgen = "0.14"
devshare-server = { path = "../server" }
tokio = { workspace = true, features = ["test-util"] }
