# Answers every request with what it was asked, so a test can tell which
# hostname and which port a guest really reached.
server {
    listen 80;
    default_type application/json;
    add_header Access-Control-Allow-Origin * always;

    location / {
        return 200 '{"service":"api","host":"$http_host","path":"$uri"}\n';
    }
}
