# The Xcode project of the iPhone app, generated by ios/build.sh (XcodeGen).
# Edit this file, not the project.
name: DevShare
options:
  bundleIdPrefix: studio.glitchr
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    DEVELOPMENT_TEAM: ${DEVSHARE_TEAM}
    CODE_SIGN_STYLE: Automatic
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  DevShare:
    type: application
    platform: iOS
    sources:
      - DevShare
      - Generated/devshare_mobile.swift
    dependencies:
      - framework: Core.xcframework
        embed: false
      - sdk: SystemConfiguration.framework
      - sdk: Security.framework
      - sdk: libresolv.tbd
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: studio.glitchr.devshare
        TARGETED_DEVICE_FAMILY: "1,2"
        GENERATE_INFOPLIST_FILE: NO
    info:
      path: DevShare/Info.plist
      properties:
        CFBundleDisplayName: DevShare
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait, UIInterfaceOrientationPortraitUpsideDown, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
        NSCameraUsageDescription: DevShare reads the QR code of an invitation.
        NSLocalNetworkUsageDescription: DevShare connects straight to the computer that shares when it is on the same network.
        # The shared services are development servers: plain HTTP is theirs
        # to choose, in this app's browser only.
        NSAppTransportSecurity:
          NSAllowsArbitraryLoadsInWebContent: true
        CFBundleURLTypes:
          - CFBundleURLName: studio.glitchr.devshare
            CFBundleURLSchemes: [devshare]
