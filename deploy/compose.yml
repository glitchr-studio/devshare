# DevShare's public server: the relay and the control plane, at one name.
#
#   DEVSHARE_HOST=relay.join.glitchr.dev docker compose -f deploy/compose.yml up -d --build
#
# The name must point at this machine first (an A record, and AAAA if it has
# IPv6), and these must be open to the internet: TCP 80 and 443, UDP 7842.
# Run from the repository's root folder: the build needs the sources.
# Paths below are relative to this file.
name: devshare-public

services:
  # Takes and renews the HTTPS certificate, and routes: /v2 to the control
  # plane, everything else to the relay.
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      DEVSHARE_HOST: ${DEVSHARE_HOST:?set DEVSHARE_HOST to the server's name}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - certificates:/data

  # Answers at /relay behind Caddy, and on UDP 7842 for address discovery,
  # with Caddy's certificate, which it reloads when Caddy renews it.
  relay:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    restart: unless-stopped
    command: iroh-relay --config-path /etc/devshare/relay.toml
    ports:
      - "7842:7842/udp"
    volumes:
      - ./relay.toml:/etc/devshare/relay.toml:ro
      - certificates:/data:ro

  # Knows invitations by their lookup key only; never sees a code.
  control:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    restart: unless-stopped
    command: devshare-server
    environment:
      DEVSHARE_LISTEN: 0.0.0.0:8787
      # Behind Caddy: the client is the address Caddy adds, for rate limits.
      DEVSHARE_TRUST_PROXY: "1"

volumes:
  certificates:
